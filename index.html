<!DOCTYPE html>
<html>
<head>
    <title>E-Commerce Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>E-Commerce Store</h1>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <section>
        <h2>Our Products</h2>

        <div class="product-card">
           <img src="laptop.jpg" alt="Laptop">
           <h3>Laptop</h3>
           <p> Price:₹50,000</p>
           <button>Add to Cart</button>
          </div>
        <div class="product-card">
           <img src="phone.jpg" alt="Phone" width="250">
            <h3>Phone</h3>
            <p>Price: ₹20,000</p>
            <button>Add to Cart</button>
        </div>

        <div class="product-card">
            <img src="headphone.jpg" alt="Headphones" width="250">
            <h3>Headphones</h3>
            <p>Price: ₹1,000</p>
            <button>Add to Cart</button>
        </div>
        <div class="product-card">
             <img src="watch.jpg" alt="Watch" width="250">
             <h3>Watch</h3>
            <p>Price: ₹5,000</p>
            <button>Add to Cart</button>
        </div>
    </section>

    <footer>
        <p>© 2026 E-Commerce Store</p>
    </footer>

</body>
</html>
